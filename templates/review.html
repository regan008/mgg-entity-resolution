<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGG Entity Resolution Review — {{ state }}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

  /* Header */
  .header { background: #2c3e50; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .progress { font-size: 14px; opacity: 0.9; }
  .progress-bar { width: 200px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-top: 4px; }
  .progress-fill { height: 100%; background: #27ae60; border-radius: 3px; transition: width 0.3s; }

  /* Stats bar */
  .stats-bar { background: #34495e; color: white; padding: 8px 24px; display: flex; gap: 24px; font-size: 13px; }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .stat-dot.match { background: #27ae60; }
  .stat-dot.reject { background: #e74c3c; }
  .stat-dot.skip { background: #f39c12; }
  .stat-dot.remaining { background: rgba(255,255,255,0.3); }

  /* Navigation */
  .nav-bar { background: white; border-bottom: 1px solid #ddd; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; }
  .nav-buttons { display: flex; gap: 8px; align-items: center; }
  .nav-buttons button { padding: 6px 16px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .nav-buttons button:hover { background: #f0f0f0; }
  .nav-buttons button:disabled { opacity: 0.4; cursor: default; }
  .pair-jump { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .pair-jump input { width: 60px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; text-align: center; }
  .filter-buttons { display: flex; gap: 4px; }
  .filter-btn { padding: 4px 10px; border: 1px solid #ddd; background: white; border-radius: 12px; cursor: pointer; font-size: 12px; }
  .filter-btn.active { background: #2c3e50; color: white; border-color: #2c3e50; }

  /* Main content */
  .main { max-width: 1400px; margin: 0 auto; padding: 16px 24px; }

  /* Score banner */
  .score-banner { background: white; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; border: 1px solid #ddd; }
  .score-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .score-item { text-align: center; }
  .score-label { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 2px; }
  .score-value { font-size: 22px; font-weight: 700; }
  .score-value.high { color: #27ae60; }
  .score-value.medium { color: #f39c12; }
  .score-value.low { color: #e74c3c; }
  .ai-info { flex: 1; min-width: 200px; padding-left: 24px; border-left: 1px solid #eee; }
  .ai-decision-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
  .ai-decision-badge.match { background: #d4edda; color: #155724; }
  .ai-decision-badge.reject { background: #f8d7da; color: #721c24; }
  .ai-decision-badge.uncertain { background: #fff3cd; color: #856404; }
  .ai-rationale { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.4; }
  .review-reason { font-size: 12px; color: #888; margin-top: 4px; }

  /* Comparison panels */
  .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .record-panel { background: white; border-radius: 8px; padding: 20px; border: 1px solid #ddd; }
  .record-panel h3 { font-size: 14px; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .record-panel h3 .record-id { font-weight: 400; font-size: 12px; }
  .field { margin-bottom: 10px; }
  .field-label { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 2px; }
  .field-value { font-size: 15px; }
  .field-value.title { font-size: 18px; font-weight: 600; }
  .field-value.na-title { color: #e74c3c; font-style: italic; }
  .field-value.empty { color: #ccc; font-style: italic; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag { display: inline-block; padding: 2px 8px; background: #eef2f7; border-radius: 10px; font-size: 11px; color: #555; }
  .tag.type { background: #e8f4fd; color: #1a6fa0; }
  .tag.amenity { background: #fef3e2; color: #8a6d3b; }
  .tag.tier { background: #e8e8e8; }

  /* Highlighted differences */
  .field-value.differs { background: #fff9e6; padding: 2px 4px; border-radius: 3px; }

  /* Decision area */
  .decision-area { background: white; border-radius: 8px; padding: 20px; border: 1px solid #ddd; }
  .decision-buttons { display: flex; gap: 12px; justify-content: center; margin-bottom: 12px; }
  .decision-btn { padding: 12px 36px; border: 2px solid; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .decision-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .decision-btn.match-btn { border-color: #27ae60; color: #27ae60; background: white; }
  .decision-btn.match-btn:hover, .decision-btn.match-btn.selected { background: #27ae60; color: white; }
  .decision-btn.reject-btn { border-color: #e74c3c; color: #e74c3c; background: white; }
  .decision-btn.reject-btn:hover, .decision-btn.reject-btn.selected { background: #e74c3c; color: white; }
  .decision-btn.skip-btn { border-color: #f39c12; color: #f39c12; background: white; }
  .decision-btn.skip-btn:hover, .decision-btn.skip-btn.selected { background: #f39c12; color: white; }
  .notes-row { display: flex; gap: 8px; }
  .notes-input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
  .already-decided { text-align: center; font-size: 13px; color: #888; margin-top: 8px; }
  .already-decided strong { color: #333; }

  /* Keyboard shortcuts help */
  .shortcuts { text-align: center; margin-top: 8px; font-size: 12px; color: #999; }
  kbd { display: inline-block; padding: 1px 6px; background: #eee; border: 1px solid #ccc; border-radius: 3px; font-family: monospace; font-size: 11px; }

  /* Loading state */
  .loading { text-align: center; padding: 60px; color: #888; font-size: 16px; }

  /* All done */
  .all-done { text-align: center; padding: 60px; }
  .all-done h2 { font-size: 24px; margin-bottom: 12px; color: #27ae60; }
  .all-done p { font-size: 16px; color: #666; }

  /* View mode tabs */
  .view-tabs { display: flex; gap: 0; margin-left: 16px; }
  .view-tab { padding: 6px 16px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; font-weight: 500; }
  .view-tab:first-child { border-radius: 4px 0 0 4px; }
  .view-tab:last-child { border-radius: 0 4px 4px 0; }
  .view-tab.active { background: #2c3e50; color: white; border-color: #2c3e50; }

  /* Batch view */
  .batch-controls { background: white; border-bottom: 1px solid #ddd; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; }
  .batch-actions { display: flex; gap: 8px; align-items: center; }
  .batch-actions button { padding: 6px 16px; border: 2px solid; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .batch-actions button:disabled { opacity: 0.4; cursor: default; }
  .batch-match-btn { border-color: #27ae60; color: #27ae60; background: white; }
  .batch-match-btn:hover:not(:disabled) { background: #27ae60; color: white; }
  .batch-reject-btn { border-color: #e74c3c; color: #e74c3c; background: white; }
  .batch-reject-btn:hover:not(:disabled) { background: #e74c3c; color: white; }
  .batch-skip-btn { border-color: #f39c12; color: #f39c12; background: white; }
  .batch-skip-btn:hover:not(:disabled) { background: #f39c12; color: white; }
  .select-count { font-size: 13px; color: #666; font-weight: 500; }
  .batch-select-all { font-size: 13px; cursor: pointer; color: #2c3e50; text-decoration: underline; }
  .batch-notes { padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; width: 250px; }

  .batch-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
  .batch-table th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-size: 12px; text-transform: uppercase; color: #666; border-bottom: 2px solid #ddd; position: sticky; top: 0; }
  .batch-table td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: top; }
  .batch-table tr:hover { background: #f8f9fa; }
  .batch-table tr.selected { background: #e8f4fd; }
  .batch-table tr.already-reviewed { opacity: 0.6; }
  .batch-table .cb-col { width: 36px; text-align: center; }
  .batch-table input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  .batch-name-col { max-width: 200px; }
  .batch-name { font-weight: 600; font-size: 14px; }
  .batch-name.na { color: #e74c3c; font-style: italic; font-weight: 500; }
  .batch-addr { color: #666; font-size: 12px; }
  .batch-meta { color: #888; font-size: 12px; }
  .batch-score { font-weight: 700; font-size: 15px; }
  .batch-ai-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .batch-ai-badge.match { background: #d4edda; color: #155724; }
  .batch-ai-badge.reject { background: #f8d7da; color: #721c24; }
  .batch-ai-badge.uncertain { background: #fff3cd; color: #856404; }
  .batch-rationale { font-size: 12px; color: #666; max-width: 300px; line-height: 1.3; }
  .batch-human-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .batch-human-badge.match { background: #27ae60; color: white; }
  .batch-human-badge.reject { background: #e74c3c; color: white; }
  .batch-human-badge.skip { background: #f39c12; color: white; }
  .batch-detail-link { color: #2c3e50; text-decoration: underline; cursor: pointer; font-size: 12px; }
  .batch-pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px; }
  .batch-pagination button { padding: 6px 14px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .batch-pagination button:disabled { opacity: 0.4; cursor: default; }
  .batch-pagination span { font-size: 13px; color: #666; }

  @media (max-width: 900px) {
    .comparison { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>MGG Entity Resolution Review &mdash; {{ state }}</h1>
  <div class="progress">
    <span id="progress-text">Loading...</span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-dot match"></div> <span id="stat-matches">0</span> matched</div>
  <div class="stat"><div class="stat-dot reject"></div> <span id="stat-rejects">0</span> rejected</div>
  <div class="stat"><div class="stat-dot skip"></div> <span id="stat-skips">0</span> skipped</div>
  <div class="stat"><div class="stat-dot remaining"></div> <span id="stat-remaining">0</span> remaining</div>
</div>

<div class="nav-bar">
  <div class="nav-buttons">
    <button onclick="navigate(-1)" id="btn-prev">&larr; Previous</button>
    <button onclick="navigate(1)" id="btn-next">Next &rarr;</button>
    <button onclick="jumpToUnreviewed()" id="btn-unreviewed" title="Jump to next unreviewed pair">Next Unreviewed</button>
    <div class="pair-jump">
      Pair <input type="number" id="jump-input" min="1" max="{{ total }}" value="1"> of {{ total }}
      <button onclick="jumpTo()">Go</button>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="view-tabs">
      <button class="view-tab active" data-view="single" onclick="setView('single')">Single</button>
      <button class="view-tab" data-view="batch" onclick="setView('batch')">Batch</button>
    </div>
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="ai_adjudicated" onclick="setFilter('ai_adjudicated')">AI Adjudicated</button>
      <button class="filter-btn" data-filter="signal_disagreement" onclick="setFilter('signal_disagreement')">Signal Disagreement</button>
      <button class="filter-btn" data-filter="unreviewed" onclick="setFilter('unreviewed')">Unreviewed</button>
    </div>
  </div>
</div>

<div class="main" id="main-content">
  <div class="loading">Loading pair data...</div>
</div>

<script>
const TOTAL = {{ total }};
let currentIndex = 0;
let currentPair = null;
let currentFilter = 'all';
let currentView = 'single';
let filteredIndices = null; // null = show all
let stats = {};

// Batch view state
let batchPage = 0;
const batchPerPage = 20;
let batchPairs = [];
let selectedPairs = new Set(); // keys as "id_a-id_b"

async function loadPair(idx) {
  currentIndex = idx;
  document.getElementById('jump-input').value = idx + 1;

  const res = await fetch(`/api/pair/${idx}`);
  if (!res.ok) {
    document.getElementById('main-content').innerHTML = '<div class="loading">Pair not found</div>';
    return;
  }
  currentPair = await res.json();
  renderPair();
  updateNav();
}

function scoreClass(val) {
  if (val >= 0.75) return 'high';
  if (val >= 0.50) return 'medium';
  return 'low';
}

function fieldVal(val, cssClass) {
  if (!val || val === 'nan' || val === 'NaN' || val === 'NA') return `<span class="field-value empty">(none)</span>`;
  const cls = cssClass ? ` ${cssClass}` : '';
  return `<span class="field-value${cls}">${escHtml(val)}</span>`;
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderRecord(rec, label, otherRec) {
  const isNA = rec.is_na_title;
  const titleClass = isNA ? 'title na-title' : 'title';
  const titleText = isNA ? `[NA-title]` : rec.title;

  let typeTags = rec.types.map(t => `<span class="tag type">${escHtml(t)}</span>`).join('');
  let amenityTags = rec.amenities.map(a => `<span class="tag amenity">${escHtml(a)}</span>`).join('');
  let tierTag = rec.geocode_tier ? `<span class="tag tier">Tier ${rec.geocode_tier}</span>` : '';

  // Highlight differences
  const addrDiffers = rec.street_address !== otherRec.street_address ? ' differs' : '';
  const yearDiffers = rec.year !== otherRec.year ? ' differs' : '';

  return `
    <div class="record-panel">
      <h3>${label} <span class="record-id">(ID: ${rec.id})</span></h3>
      <div class="field">
        <div class="field-label">Title</div>
        ${fieldVal(titleText, titleClass)}
      </div>
      <div class="field">
        <div class="field-label">Address</div>
        ${fieldVal(rec.street_address, addrDiffers ? 'differs' : '')}
      </div>
      <div class="field">
        <div class="field-label">City / State</div>
        <span class="field-value">${escHtml(rec.city || '')}${rec.state ? ', ' + rec.state : ''}</span>
      </div>
      <div class="field">
        <div class="field-label">Year</div>
        <span class="field-value${yearDiffers}">${rec.year || '?'}</span>
      </div>
      ${rec.description ? `<div class="field">
        <div class="field-label">Description</div>
        <span class="field-value">${escHtml(rec.description)}</span>
      </div>` : ''}
      ${rec.latitude ? `<div class="field">
        <div class="field-label">Coordinates</div>
        <span class="field-value">${rec.latitude.toFixed(6)}, ${rec.longitude.toFixed(6)}</span>
      </div>` : ''}
      <div class="field">
        <div class="field-label">Status</div>
        <span class="field-value" style="font-size:12px">${escHtml(rec.status || '')}</span>
      </div>
      <div class="field">
        <div class="field-label">Type / Amenities</div>
        <div class="tags">${tierTag}${typeTags}${amenityTags}</div>
      </div>
    </div>
  `;
}

function renderPair() {
  const p = currentPair;
  const s = p.scores;

  const aiDecisionClass = p.ai_decision === 'match' ? 'match' : p.ai_decision === 'reject' ? 'reject' : 'uncertain';

  let html = `
    <div class="score-banner">
      <div class="score-row">
        <div class="score-item">
          <div class="score-label">Composite</div>
          <div class="score-value ${scoreClass(s.composite)}">${s.composite.toFixed(2)}</div>
        </div>
        <div class="score-item">
          <div class="score-label">Embedding</div>
          <div class="score-value ${scoreClass(s.embedding)}">${s.embedding.toFixed(2)}</div>
        </div>
        <div class="score-item">
          <div class="score-label">Jaro-Winkler</div>
          <div class="score-value ${scoreClass(s.jaro_winkler)}">${s.jaro_winkler.toFixed(2)}</div>
        </div>
        <div class="score-item">
          <div class="score-label">Address Overlap</div>
          <div class="score-value ${scoreClass(s.address_overlap)}">${s.address_overlap.toFixed(2)}</div>
        </div>
        <div class="ai-info">
          <div>
            <span class="ai-decision-badge ${aiDecisionClass}">${p.ai_decision || 'N/A'}</span>
            ${p.ai_confidence !== null ? `<span style="font-size:12px;color:#888;margin-left:8px">confidence: ${p.ai_confidence}</span>` : ''}
          </div>
          <div class="ai-rationale">${escHtml(p.ai_rationale || '')}</div>
          <div class="review-reason">${escHtml(p.review_reason || '')}${p.edge_case ? ' | Edge case: ' + escHtml(p.edge_case) : ''}</div>
        </div>
      </div>
    </div>

    <div class="comparison">
      ${renderRecord(p.record_a, 'Record A', p.record_b)}
      ${renderRecord(p.record_b, 'Record B', p.record_a)}
    </div>

    <div class="decision-area">
      <div class="decision-buttons">
        <button class="decision-btn match-btn ${p.human_decision === 'match' ? 'selected' : ''}" onclick="decide('match')">Match</button>
        <button class="decision-btn reject-btn ${p.human_decision === 'reject' ? 'selected' : ''}" onclick="decide('reject')">Reject</button>
        <button class="decision-btn skip-btn ${p.human_decision === 'skip' ? 'selected' : ''}" onclick="decide('skip')">Skip</button>
      </div>
      <div class="notes-row">
        <input type="text" class="notes-input" id="notes-input" placeholder="Optional notes..." value="${escHtml(p.human_notes || '')}">
      </div>
      ${p.human_decision ? `<div class="already-decided">Previously decided: <strong>${p.human_decision}</strong></div>` : ''}
      <div class="shortcuts">
        Keyboard: <kbd>M</kbd> Match &nbsp; <kbd>R</kbd> Reject &nbsp; <kbd>S</kbd> Skip &nbsp; <kbd>&larr;</kbd> Prev &nbsp; <kbd>&rarr;</kbd> Next &nbsp; <kbd>U</kbd> Next Unreviewed
      </div>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;
}

async function decide(decision) {
  const p = currentPair;
  const notes = document.getElementById('notes-input').value;

  const res = await fetch('/api/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      id_a: p.id_a,
      id_b: p.id_b,
      decision: decision,
      notes: notes,
    })
  });

  if (res.ok) {
    currentPair.human_decision = decision;
    currentPair.human_notes = notes;

    // Highlight the selected button
    document.querySelectorAll('.decision-btn').forEach(b => b.classList.remove('selected'));
    document.querySelector(`.${decision}-btn`).classList.add('selected');

    await updateStats();

    // Auto-advance to next unreviewed after a brief delay
    setTimeout(() => {
      const nextIdx = findNextUnreviewed(currentIndex + 1);
      if (nextIdx !== null) {
        loadPair(nextIdx);
      } else {
        // Try wrapping around
        const wrapped = findNextUnreviewed(0);
        if (wrapped !== null && wrapped !== currentIndex) {
          loadPair(wrapped);
        } else {
          renderAllDone();
        }
      }
    }, 300);
  }
}

function findNextUnreviewed(startFrom) {
  // This is approximate — we track via stats endpoint
  // For now, just advance to next pair
  if (startFrom < TOTAL) return startFrom;
  return null;
}

function renderAllDone() {
  document.getElementById('main-content').innerHTML = `
    <div class="all-done">
      <h2>All pairs reviewed!</h2>
      <p>${stats.matches || 0} matches, ${stats.rejects || 0} rejects, ${stats.skips || 0} skipped</p>
      <p style="margin-top:12px">Decisions saved to human_review_decisions.csv</p>
      <p style="margin-top:8px;font-size:14px;color:#888">You can close this window or go back to review any pair.</p>
    </div>
  `;
}

function navigate(delta) {
  let newIdx = currentIndex + delta;
  if (newIdx < 0) newIdx = 0;
  if (newIdx >= TOTAL) newIdx = TOTAL - 1;
  loadPair(newIdx);
}

function jumpTo() {
  const val = parseInt(document.getElementById('jump-input').value);
  if (val >= 1 && val <= TOTAL) {
    loadPair(val - 1);
  }
}

async function jumpToUnreviewed() {
  const res = await fetch('/api/stats');
  const data = await res.json();
  if (data.next_unreviewed !== null) {
    loadPair(data.next_unreviewed);
  }
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  if (currentView === 'batch') {
    loadBatchPage(0);
  } else {
    if (filter === 'unreviewed') {
      jumpToUnreviewed();
    } else {
      loadPair(0);
    }
  }
}

function updateNav() {
  document.getElementById('btn-prev').disabled = currentIndex <= 0;
  document.getElementById('btn-next').disabled = currentIndex >= TOTAL - 1;
}

async function updateStats() {
  const res = await fetch('/api/stats');
  stats = await res.json();
  document.getElementById('stat-matches').textContent = stats.matches;
  document.getElementById('stat-rejects').textContent = stats.rejects;
  document.getElementById('stat-skips').textContent = stats.skips;
  document.getElementById('stat-remaining').textContent = stats.total - stats.reviewed;
  document.getElementById('progress-text').textContent = `${stats.reviewed} of ${stats.total} reviewed`;
  const pct = stats.total > 0 ? (stats.reviewed / stats.total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── View switching ──
function setView(view) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  if (view === 'batch') {
    loadBatchPage(0);
  } else {
    loadPair(currentIndex);
  }
}

// ── Batch view ──
async function loadBatchPage(page) {
  batchPage = page;
  selectedPairs.clear();
  const showReviewed = currentFilter !== 'unreviewed';
  const res = await fetch(`/api/pairs?page=${page}&per_page=${batchPerPage}&filter=${currentFilter}&show_reviewed=${showReviewed}`);
  const data = await res.json();
  batchPairs = data.pairs;
  renderBatchView(data);
}

function renderBatchView(data) {
  const container = document.getElementById('main-content');

  let rows = '';
  for (const p of data.pairs) {
    const key = `${p.id_a}-${p.id_b}`;
    const isReviewed = p.human_decision !== null;
    const rowClass = isReviewed ? 'already-reviewed' : '';
    const aiClass = p.ai_decision === 'match' ? 'match' : p.ai_decision === 'reject' ? 'reject' : 'uncertain';

    const titleA = p.record_a.is_na_title ? `<span class="batch-name na">[NA] ${escHtml(p.record_a.description || '').substring(0, 40)}</span>` : `<span class="batch-name">${escHtml(p.record_a.title)}</span>`;
    const titleB = p.record_b.is_na_title ? `<span class="batch-name na">[NA] ${escHtml(p.record_b.description || '').substring(0, 40)}</span>` : `<span class="batch-name">${escHtml(p.record_b.title)}</span>`;

    const addrA = p.record_a.street_address || '';
    const addrB = p.record_b.street_address || '';

    rows += `
      <tr class="${rowClass}" data-key="${key}" data-ida="${p.id_a}" data-idb="${p.id_b}" data-idx="${p.index}">
        <td class="cb-col"><input type="checkbox" onchange="toggleSelect('${key}', this.checked)" ${isReviewed ? '' : ''}></td>
        <td>
          ${titleA}<br>
          <span class="batch-addr">${escHtml(addrA) || '<em style="color:#ccc">(no address)</em>'}</span><br>
          <span class="batch-meta">${escHtml(p.record_a.city)}, ${p.record_a.year}</span>
        </td>
        <td>
          ${titleB}<br>
          <span class="batch-addr">${escHtml(addrB) || '<em style="color:#ccc">(no address)</em>'}</span><br>
          <span class="batch-meta">${escHtml(p.record_b.city)}, ${p.record_b.year}</span>
        </td>
        <td style="text-align:center">
          <span class="batch-score ${scoreClass(p.scores.composite)}">${p.scores.composite.toFixed(2)}</span><br>
          <span class="batch-meta">E:${p.scores.embedding.toFixed(2)} J:${p.scores.jaro_winkler.toFixed(2)} A:${p.scores.address_overlap.toFixed(2)}</span>
        </td>
        <td style="text-align:center">
          <span class="batch-ai-badge ${aiClass}">${p.ai_decision || '?'}</span>
          ${p.ai_confidence !== null ? `<br><span class="batch-meta">${p.ai_confidence}</span>` : ''}
        </td>
        <td><span class="batch-rationale">${escHtml(p.ai_rationale || '')}</span></td>
        <td style="text-align:center">
          ${isReviewed ? `<span class="batch-human-badge ${p.human_decision}">${p.human_decision}</span>` : '<span class="batch-meta">-</span>'}
        </td>
        <td><span class="batch-detail-link" onclick="viewDetail(${p.index})">View</span></td>
      </tr>
    `;
  }

  container.innerHTML = `
    <div class="batch-controls">
      <div class="batch-actions">
        <span class="select-count"><span id="batch-select-count">0</span> selected</span>
        <span class="batch-select-all" onclick="selectAllVisible()">Select all on page</span>
        <span class="batch-select-all" onclick="deselectAll()">Deselect all</span>
        <span style="color:#ccc">|</span>
        <button class="batch-match-btn" onclick="batchDecide('match')" id="batch-match-btn" disabled>Match Selected</button>
        <button class="batch-reject-btn" onclick="batchDecide('reject')" id="batch-reject-btn" disabled>Reject Selected</button>
        <button class="batch-skip-btn" onclick="batchDecide('skip')" id="batch-skip-btn" disabled>Skip Selected</button>
        <input type="text" class="batch-notes" id="batch-notes" placeholder="Optional batch notes...">
      </div>
    </div>
    <table class="batch-table">
      <thead>
        <tr>
          <th class="cb-col"><input type="checkbox" onchange="toggleSelectAll(this.checked)"></th>
          <th>Record A</th>
          <th>Record B</th>
          <th style="text-align:center">Score</th>
          <th style="text-align:center">AI</th>
          <th>Rationale</th>
          <th style="text-align:center">Your Decision</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="batch-pagination">
      <button onclick="loadBatchPage(${data.page - 1})" ${data.page <= 0 ? 'disabled' : ''}>Previous</button>
      <span>Page ${data.page + 1} of ${data.total_pages} (${data.total_filtered} pairs)</span>
      <button onclick="loadBatchPage(${data.page + 1})" ${data.page + 1 >= data.total_pages ? 'disabled' : ''}>Next</button>
    </div>
  `;
}

function toggleSelect(key, checked) {
  if (checked) {
    selectedPairs.add(key);
  } else {
    selectedPairs.delete(key);
  }
  updateBatchButtons();
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.batch-table tbody input[type="checkbox"]').forEach(cb => {
    cb.checked = checked;
    const row = cb.closest('tr');
    const key = row.dataset.key;
    if (checked) selectedPairs.add(key); else selectedPairs.delete(key);
  });
  updateBatchButtons();
}

function selectAllVisible() {
  document.querySelectorAll('.batch-table tbody input[type="checkbox"]').forEach(cb => {
    cb.checked = true;
    const row = cb.closest('tr');
    selectedPairs.add(row.dataset.key);
  });
  updateBatchButtons();
}

function deselectAll() {
  selectedPairs.clear();
  document.querySelectorAll('.batch-table tbody input[type="checkbox"]').forEach(cb => cb.checked = false);
  updateBatchButtons();
}

function updateBatchButtons() {
  const count = selectedPairs.size;
  const el = document.getElementById('batch-select-count');
  if (el) el.textContent = count;
  const btns = ['batch-match-btn', 'batch-reject-btn', 'batch-skip-btn'];
  btns.forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.disabled = count === 0;
  });
}

async function batchDecide(decision) {
  if (selectedPairs.size === 0) return;

  const notes = document.getElementById('batch-notes')?.value || '';
  const pairs = Array.from(selectedPairs).map(key => {
    const [id_a, id_b] = key.split('-').map(Number);
    return { id_a, id_b };
  });

  const count = pairs.length;
  if (!confirm(`Apply "${decision}" to ${count} pair${count > 1 ? 's' : ''}?`)) return;

  const res = await fetch('/api/decide_batch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ decision, notes, pairs })
  });

  if (res.ok) {
    selectedPairs.clear();
    await updateStats();
    loadBatchPage(batchPage);
  }
}

function viewDetail(idx) {
  currentIndex = idx;
  setView('single');
  loadPair(idx);
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
  // Don't trigger if typing in an input or textarea
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  const key = e.key.toLowerCase();

  if (currentView === 'single') {
    switch (key) {
      case 'm': e.preventDefault(); decide('match'); break;
      case 'r': e.preventDefault(); decide('reject'); break;
      case 's': e.preventDefault(); decide('skip'); break;
      case 'arrowleft': e.preventDefault(); navigate(-1); break;
      case 'arrowright': e.preventDefault(); navigate(1); break;
      case 'u': e.preventDefault(); jumpToUnreviewed(); break;
    }
  } else if (currentView === 'batch') {
    switch (key) {
      case 'm': e.preventDefault(); batchDecide('match'); break;
      case 'r': e.preventDefault(); batchDecide('reject'); break;
      case 's': e.preventDefault(); batchDecide('skip'); break;
      case 'a':
        // Select/deselect all visible
        e.preventDefault();
        const checkboxes = document.querySelectorAll('.batch-select');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        checkboxes.forEach(cb => {
          cb.checked = !allChecked;
          const key = cb.dataset.key;
          if (cb.checked) selectedPairs.add(key); else selectedPairs.delete(key);
        });
        document.getElementById('selected-count').textContent = selectedPairs.size;
        break;
      case 'arrowleft': e.preventDefault(); if (batchPage > 0) loadBatchPage(batchPage - 1); break;
      case 'arrowright': e.preventDefault(); loadBatchPage(batchPage + 1); break;
    }
  }
});

// Init
(async () => {
  await updateStats();
  // Start at first unreviewed pair
  if (stats.next_unreviewed !== null) {
    loadPair(stats.next_unreviewed);
  } else {
    loadPair(0);
  }
})();
</script>
</body>
</html>
